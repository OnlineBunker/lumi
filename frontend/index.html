<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Ask questions about a PDF and get answers that point to the page." />
    <title>Lumi</title>
    <script>
      // Set the theme before first paint: the saved choice, else follow the system (live)
      (() => {
        const saved = () => { try { return localStorage.getItem('theme') } catch { return null } }
        const system = matchMedia('(prefers-color-scheme: dark)')
        const apply = () => { document.documentElement.dataset.theme = saved() || (system.matches ? 'dark' : 'light') }
        apply()
        system.addEventListener('change', () => !saved() && apply())
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
